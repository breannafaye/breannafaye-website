<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello World</title>
<style>
  :root {
    --margin: clamp(28px, 5.2vw, 80px);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: #07080c;
    color: rgba(236, 230, 224, 0.88);
  }

  html {
    scrollbar-width: none;
    overscroll-behavior: none;
  }

  body::-webkit-scrollbar { width: 0; height: 0; }

  body {
    font-family: Inter, "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 400;
    font-size: 13px;
    line-height: 1.5;
    letter-spacing: 0.01em;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }

  ::selection {
    background: rgba(198, 163, 150, 0.35);
    color: inherit;
  }

  #runway { height: 1400vh; }

  #stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
    --mass: #141c24;
    --mass-far: #2a3c4a;
    --mass-near: #0e1418;
    --lit: #1e2c36;
    --line: #9eb0ba;
    --glow: #6e8c9e;
    --tech: 0;
    --art: 0;
    --empty: 0;
  }

  #sky {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg,
      #07080c 0%,
      #0c1016 20%,
      #15202a 46%,
      #1e3342 62%,
      #2a4554 78%,
      #101820 100%);
  }

  #plates {
    position: absolute;
    inset: 0;
    transform-origin: 50% 64%;
    z-index: 1;
  }

  #stars,
  #limb,
  #hline,
  .plane {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  #stars { z-index: 0; }
  #limb { z-index: 1; }
  #cloud-shift { z-index: 2; }
  #glow { z-index: 3; }
  #stack-far { z-index: 4; }
  #hline { z-index: 5; }
  #stack-mid { z-index: 6; }
  #water { z-index: 7; }
  #stack-near { z-index: 8; }
  #bay { z-index: 9; }

  #stack-far,
  #stack-mid,
  #stack-near,
  #cloud-shift {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  #stack-far {
    -webkit-mask-image: linear-gradient(180deg, #000 46%, transparent 70%);
    mask-image: linear-gradient(180deg, #000 46%, transparent 70%);
  }

  #stack-mid {
    -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 67.5%, transparent 76%);
    mask-image: linear-gradient(180deg, #000 0%, #000 67.5%, transparent 76%);
  }

  #stack-near {
    -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 80%, transparent 96%);
    mask-image: linear-gradient(180deg, #000 0%, #000 80%, transparent 96%);
  }

  .plane { opacity: 0; }
  .plane.far { filter: blur(3px); }

  svg .b { fill: var(--mass); }
  svg .bf { fill: var(--mass-far); }
  svg .bn { fill: var(--mass-near); }
  svg .lit { fill: var(--lit); }
  svg .tower { fill: url(#glass); }

  #hline { opacity: 0; }

  #glow {
    position: absolute;
    left: -12%;
    width: 124%;
    top: 42%;
    height: 34%;
    background: radial-gradient(ellipse at 72% 48%, var(--glow), transparent 68%);
    opacity: 0;
    pointer-events: none;
    filter: blur(6px);
  }

  #cloud-shift { pointer-events: none; }

  #clouds { position: absolute; inset: 0; opacity: 0; }

  #clouds span {
    position: absolute;
    display: block;
    border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(236, 232, 228, 0.55), rgba(236, 232, 228, 0) 70%);
    filter: blur(10px);
  }

  #clouds span:nth-child(1) {
    width: 48vw;
    height: 11vh;
    left: -10vw;
    top: 18vh;
    animation: drift 80s ease-in-out infinite alternate;
  }

  #clouds span:nth-child(2) {
    width: 32vw;
    height: 7vh;
    left: 38vw;
    top: 28vh;
    opacity: 0.65;
    animation: drift 100s ease-in-out infinite alternate-reverse;
  }

  #clouds span:nth-child(3) {
    width: 26vw;
    height: 6vh;
    left: 64vw;
    top: 14vh;
    opacity: 0.5;
    animation: drift 90s ease-in-out infinite alternate;
  }

  @keyframes drift {
    from { transform: translate3d(0, 0, 0); }
    to { transform: translate3d(5vw, 1.4vh, 0); }
  }

  #water {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 42%;
    opacity: 0;
    pointer-events: none;
    background: linear-gradient(180deg, rgba(20, 16, 18, 0.04), transparent 36%);
  }

  #bay {
    position: absolute;
    right: -10%;
    bottom: -8%;
    width: 68%;
    height: 46%;
    pointer-events: none;
    opacity: 0;
    background: radial-gradient(ellipse at 58% 42%, rgba(255, 246, 240, 0.72), rgba(232, 196, 184, 0.18) 42%, transparent 70%);
    animation: heat 18s ease-in-out infinite;
  }

  @keyframes heat {
    0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
    50% { transform: translate3d(-2.4vw, -1vh, 0) scale(1.05); }
  }

  #veil {
    position: absolute;
    inset: 0;
    background: #100e12;
    opacity: calc(var(--empty) * 0.5);
    pointer-events: none;
    z-index: 2;
  }

  #depths { position: absolute; inset: 0; z-index: 3; pointer-events: none; }

  .depth { position: absolute; inset: 0; }

  #depth-tech {
    opacity: var(--tech);
    transform: translate3d(0, calc((1 - var(--tech)) * 30px), 0);
  }

  #depth-art {
    opacity: var(--art);
    transform: translate3d(0, calc((1 - var(--art)) * 36px), 0);
  }

  #depth-empty {
    opacity: var(--empty);
    transform: translate3d(0, calc((1 - var(--empty)) * 22px), 0);
  }

  .research {
    position: absolute;
    left: var(--margin);
    top: 20vh;
    width: min(300px, 32vw);
    filter: blur(0.45px);
  }

  .kicker,
  #places span,
  #brebot-name,
  #brebot button,
  .art span,
  .rt {
    letter-spacing: 0.26em;
  }

  .kicker {
    margin: 0 0 22px;
    font-size: 11px;
    color: rgba(236, 230, 224, 0.5);
  }

  .rt {
    margin: 20px 0 6px;
    font-size: 13px;
    color: rgba(236, 230, 224, 0.78);
  }

  .ra {
    margin: 0;
    max-width: 28ch;
    font-size: 12px;
    line-height: 1.55;
    color: rgba(236, 230, 224, 0.46);
  }

  .piece { position: absolute; }

  .v1 {
    left: 31vw;
    top: 38vh;
    width: 15vw;
    height: 42vh;
    background: #e4d0c6;
  }

  .v1::after {
    content: "";
    position: absolute;
    inset: 10%;
    border: 1px solid rgba(42, 34, 32, 0.28);
  }

  .v2 {
    left: 49vw;
    top: 52vh;
    width: 20vw;
    height: 20vh;
    background: #f3ece6;
  }

  .v2::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 13%;
    background: #6d7c86;
  }

  .v3 {
    left: 50.5vw;
    top: 28vh;
    width: 10vw;
    height: 15vh;
    background: #7e8c96;
  }

  .v3::after {
    content: "";
    position: absolute;
    left: 14%;
    right: 14%;
    top: 64%;
    height: 1px;
    background: rgba(244, 238, 232, 0.5);
  }

  .art { position: absolute; }

  .a1 {
    left: 7vw;
    top: 30vh;
    width: 18vw;
    height: 48vh;
    background: #e7d4ca;
  }

  .a2 {
    left: 29vw;
    top: 44vh;
    width: 24vw;
    height: 32vh;
    background: #f4eee8;
  }

  .a3 {
    left: 56vw;
    top: 28vh;
    width: 13vw;
    height: 46vh;
    background: #74828c;
  }

  .art span {
    position: absolute;
    left: 0;
    top: calc(100% + 14px);
    font-size: 11px;
    color: #2a2422;
  }

  .slot {
    position: absolute;
    left: 7vw;
    top: 30vh;
    width: 18vw;
    height: 48vh;
    border: 1px solid rgba(244, 238, 232, 0.42);
  }

  #grain {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 4;
    pointer-events: none;
    opacity: 0.16;
    mix-blend-mode: overlay;
  }

  #hello {
    position: absolute;
    left: 50%;
    top: 30vh;
    z-index: 5;
    margin: 0;
    font: inherit;
    font-size: 15px;
    font-weight: 400;
    letter-spacing: 0.42em;
    padding-left: 0.42em;
    color: rgba(236, 230, 224, 0.9);
    white-space: nowrap;
    user-select: none;
  }

  #places {
    position: absolute;
    top: var(--margin);
    left: var(--margin);
    z-index: 5;
    user-select: none;
  }

  #places span {
    position: absolute;
    left: 0;
    top: 0;
    font-size: 12px;
    color: rgba(236, 230, 224, 0.72);
    opacity: 0;
    white-space: nowrap;
  }

  #brebot {
    position: absolute;
    top: 15vh;
    right: var(--margin);
    z-index: 5;
    width: min(280px, calc(100% - (var(--margin) * 2)));
    opacity: 0;
    pointer-events: none;
    transition: opacity 800ms ease;
  }

  #brebot::before {
    content: "";
    position: absolute;
    z-index: -1;
    inset: -36px -28px -40px -56px;
    background: radial-gradient(ellipse at 70% 24%, rgba(16, 12, 16, 0.28), transparent 72%);
    pointer-events: none;
  }

  #brebot.on {
    opacity: 1;
    pointer-events: auto;
  }

  #brebot-name {
    margin: 0 0 10px;
    font-size: 12px;
    color: rgba(236, 230, 224, 0.78);
  }

  #brebot-name:empty { display: none; }

  #brebot-say {
    margin: 0;
    max-width: 26ch;
    font-size: 13px;
    line-height: 1.55;
    letter-spacing: 0.012em;
    color: rgba(236, 230, 224, 0.86);
  }

  #brebot-choices {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 18px;
    margin-top: 36px;
  }

  #brebot button {
    appearance: none;
    background: none;
    border: 0;
    padding: 0;
    font: inherit;
    font-size: 12px;
    color: rgba(236, 230, 224, 0.74);
    cursor: pointer;
    position: relative;
  }

  #brebot button::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: -5px;
    height: 1px;
    background: currentColor;
    transform: scaleX(0);
    transform-origin: left center;
    transition: transform 420ms ease;
    opacity: 0.75;
  }

  #brebot button:hover,
  #brebot button:focus-visible {
    color: rgba(248, 244, 240, 0.96);
    outline: none;
  }

  #brebot button:hover::after,
  #brebot button:focus-visible::after {
    transform: scaleX(1);
  }

  #brebot button:has(.empty-choice)::after { content: none; }

  #brebot .empty-choice {
    display: block;
    width: 1.5em;
    height: 1px;
    margin: 0.55em 0;
    background: currentColor;
    opacity: 0.45;
    transition: width 420ms ease, opacity 420ms ease;
  }

  #brebot button:hover .empty-choice,
  #brebot button:focus-visible .empty-choice {
    width: 2.5em;
    opacity: 0.95;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
  }

  @media (max-width: 720px) {
    #hello { font-size: 13px; letter-spacing: 0.32em; padding-left: 0.32em; }
    .a1, .slot { width: 34vw; }
    .a2 { left: 46vw; width: 28vw; }
    .a3 { display: none; }
    .v1 { left: 42vw; width: 28vw; }
    .v2, .v3 { display: none; }
  }
</style>
</head>

        <rect class="b" x="960" y="586" width="480" height="28"/>
        <rect class="b" x="990" y="500" width="74" height="102"/>
        <polygon class="b" points="1104,602 1134,286 1168,602"/>
        <rect class="b" x="1190" y="468" width="92" height="134"/>

      <svg class="plane mid" data-i="7" data-plane="mid" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <rect class="b" x="168" y="468" width="74" height="134"/>

    <div id="water" aria-hidden="true"></div>

    <div id="stack-near">

          <path d="M50 50 C 78 32 118 34 142 56 C 102 40 70 42 50 54 Z"/>

  <div id="depths">
    <section class="depth" id="depth-tech" aria-hidden="true">
      <div class="research">
        <p class="kicker">Research</p>
        <p class="rt">01</p>
        <p class="ra">A short abstract, one layer back.</p>
        <p class="rt">02</p>
        <p class="ra">Held behind the visual work.</p>
      </div>
      <div class="piece v1" aria-hidden="true"></div>
      <div class="piece v2" aria-hidden="true"></div>
      <div class="piece v3" aria-hidden="true"></div>
    </section>
    <section class="depth" id="depth-art" aria-hidden="true">
      <figure class="art a1"><span>01</span></figure>
      <figure class="art a2"><span>02</span></figure>
      <figure class="art a3"><span>03</span></figure>
    </section>
    <section class="depth" id="depth-empty" aria-hidden="true">
      <div class="slot" role="img" aria-label="Empty depth"></div>

  <svg id="grain" aria-hidden="true">
    <filter id="grainf" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <rect width="100%" height="100%" filter="url(#grainf)"/>
  </svg>

  <h1 id="hello">Hello World</h1>
  <div id="places" aria-hidden="true">
    <span data-i="1">Ohio</span>
    <span data-i="2">Boston</span>
    <span data-i="3">Santiago</span>
    <span data-i="4">Lima</span>
    <span data-i="5">NYC</span>
    <span data-i="6">London</span>
    <span data-i="7">Miami</span>
  </div>

  <nav id="brebot" aria-label="brebot" aria-hidden="true" inert>
    <p id="brebot-name"></p>
    <p id="brebot-say"></p>
    <div id="brebot-choices"></div>
  </nav>
</div>

<script>
(() => {
  const order = ["world", "ohio", "boston", "santiago", "lima", "nyc", "london", "miami"];
  const cuts = [0, 0.11, 0.24, 0.37, 0.50, 0.63, 0.76, 0.88, 1];
  const TRANS = 0.036;
  const JOURNEY_VH = 10;
  const LOCK_VH = 2.5;

  const skies = [
    ["#07080c", "#0c1016", "#15202a", "#1e3342", "#2a4554", "#101820"],
    ["#080a0e", "#12181e", "#243440", "#3c5160", "#6a7d8a", "#1a262e"],
    ["#090b10", "#141c24", "#2a3c4a", "#466070", "#7a8e9a", "#203038"],
    ["#0b0c10", "#171d24", "#31404a", "#5a6a74", "#8d7e78", "#2a3032"],
    ["#0d0e12", "#1a2026", "#3a4650", "#6a7478", "#a0908c", "#343230"],
    ["#100e12", "#201c20", "#40383c", "#7a6868", "#c2a49a", "#3e3432"],
    ["#110e12", "#262024", "#4e4044", "#8a706c", "#d4b2a8", "#5a4640"],
    ["#120f14", "#241f24", "#5c5158", "#c4a096", "#f0ddd4", "#f6f1eb"]
  ];
  const masses = ["#141c24", "#1a242c", "#1c2830", "#221e22", "#262224", "#2a2222", "#2c1e1e", "#2a1c1a"];
  const fars = ["#2a3c4a", "#314656", "#385060", "#3c4448", "#404448", "#463e3e", "#4a3c3a", "#4e3e3a"];
  const lits = ["#1e2c36", "#243844", "#2c4452", "#3a3c3a", "#4a4440", "#6a534c", "#907064", "#c6a396"];
  const lines = ["#9eb0ba", "#a9bcc6", "#b4c6ce", "#cbbdb6", "#ddd0c8", "#eadcd4", "#f3e6df", "#f7f2ec"];
  const glows = ["#6e8c9e", "#7f97a6", "#8aa4b0", "#a8948c", "#c2a69c", "#e0c2b6", "#efd0c4", "#f6e4dc"];

  const voices = {
    city: {
      name: "",
      say: "You’re over Miami.\nI can take you closer.",
      choices: [
        ["tech", "Tech"],
        ["art", "Art"],
        ["empty", ""]
      ]
    },
    tech: {
      name: "Tech",
      say: "Visual work in front. Research one layer back.",
      choices: [
        ["art", "Art"],
        ["empty", ""],
        ["city", "Back"]
      ]
    },
    art: {
      name: "Art",
      say: "A few pieces, large. The skyline stays in the far layer.",
      choices: [
        ["tech", "Tech"],
        ["empty", ""],
        ["city", "Back"]
      ]
    },
    empty: {
      name: "",
      say: "This depth is empty.\nIt is waiting.",
      choices: [
        ["tech", "Tech"],
        ["art", "Art"],
        ["city", "Back"]
      ]
    }
  };

  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const LERP = reduce ? 1 : 0.09;
  const DEPTH_MS = reduce ? 1 : 2100;

  const runway = document.getElementById("runway");
  const stage = document.getElementById("stage");
  const sky = document.getElementById("sky");
  const stars = document.getElementById("stars");
  const limb = document.getElementById("limb");
  const clouds = document.getElementById("clouds");
  const cloudShift = document.getElementById("cloud-shift");
  const glow = document.getElementById("glow");
  const hline = document.getElementById("hline");
  const water = document.getElementById("water");
  const bay = document.getElementById("bay");
  const plates = document.getElementById("plates");
  const hello = document.getElementById("hello");
  const placeSpans = document.querySelectorAll("#places span");
  const planes = document.querySelectorAll(".plane");
  const brebot = document.getElementById("brebot");
  const brebotName = document.getElementById("brebot-name");
  const brebotSay = document.getElementById("brebot-say");
  const brebotChoices = document.getElementById("brebot-choices");

  const svgNS = "http://www.w3.org/2000/svg";
  let seed = 11;
  function rnd() {
    seed = (seed * 16807) % 2147483647;
    return (seed - 1) / 2147483646;
  }
  for (let n = 0; n < 46; n++) {
    const c = document.createElementNS(svgNS, "circle");
    c.setAttribute("cx", (rnd() * 1440).toFixed(1));
    c.setAttribute("cy", (rnd() * 460).toFixed(1));
    c.setAttribute("r", (rnd() < 0.88 ? 0.7 : 1.15).toFixed(2));
    const tone = rnd() < 0.82 ? "232,228,222" : "226,206,196";
    c.setAttribute("fill", `rgba(${tone},${(0.22 + rnd() * 0.5).toFixed(2)})`);
    stars.appendChild(c);
  }

  let journeyPx = 1;
  let visual = 0;
  let settled = "city";
  let animating = false;
  let anim = null;
  let pin = 0;
  const mix = { tech: 0, art: 0, empty: 0 };

  function measure() {
    const h = window.innerHeight || 1;
    journeyPx = h * JOURNEY_VH;
    runway.style.height = `${journeyPx + h * LOCK_VH + h}px`;
  }

  function smoothstep(t) {
    const x = t < 0 ? 0 : t > 1 ? 1 : t;
    return x * x * (3 - 2 * x);
  }

  function influence(p, i) {
    const left = cuts[i];
    const right = cuts[i + 1];
    const last = i === cuts.length - 2;
    if (p < left - TRANS || (p > right + TRANS && !last)) return 0;
    let inf = 1;
    if (i > 0) inf = Math.min(inf, smoothstep((p - (left - TRANS)) / (2 * TRANS)));
    if (!last) inf = Math.min(inf, 1 - smoothstep((p - (right - TRANS)) / (2 * TRANS)));
    return inf;
  }

  function hexToRgb(h) {
    const n = parseInt(h.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }

  function mixHex(a, b, t) {
    const A = hexToRgb(a);
    const B = hexToRgb(b);
    const r = A[0] + (B[0] - A[0]) * t;
    const g = A[1] + (B[1] - A[1]) * t;
    const bl = A[2] + (B[2] - A[2]) * t;
    return `rgb(${r | 0},${g | 0},${bl | 0})`;
  }

  function darken(rgb, amt) {
    const m = rgb.match(/\d+/g).map(Number);
    return `rgb(${m[0] * amt | 0},${m[1] * amt | 0},${m[2] * amt | 0})`;
  }

  function ease(t) {
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }

  function renderVoice(name) {
    const v = voices[name];
    brebotName.textContent = v.name;
    brebotSay.replaceChildren();
    v.say.split("\n").forEach((part, i) => {
      if (i) brebotSay.appendChild(document.createElement("br"));
      brebotSay.appendChild(document.createTextNode(part));
    });
    brebotChoices.replaceChildren();
    v.choices.forEach(([id, label]) => {
      const b = document.createElement("button");
      b.type = "button";
      b.dataset.go = id;
      if (!label) {
        b.setAttribute("aria-label", "Empty depth");
        const rule = document.createElement("span");
        rule.className = "empty-choice";
        b.appendChild(rule);
      } else {
        b.textContent = label;
      }
      brebotChoices.appendChild(b);
    });
  }

  function setBrebot(on) {
    brebot.classList.toggle("on", on);
    brebot.toggleAttribute("inert", !on);
    brebot.setAttribute("aria-hidden", on ? "false" : "true");
  }

  function lockedNow() {
    return (window.scrollY || 0) >= journeyPx - 0.5;
  }

  function paint(p, locked) {
    const f = p * (skies.length - 1);
    const i0 = Math.min(skies.length - 2, Math.floor(f));
    const t = f - i0;
    const stops = [0, 20, 46, 62, 78, 100];
    const cols = skies[i0].map((c, k) => mixHex(c, skies[i0 + 1][k], t));
    sky.style.background = `linear-gradient(180deg, ${cols.map((c, k) => `${c} ${stops[k]}%`).join(",")})`;

    const mass = mixHex(masses[i0], masses[i0 + 1], t);
    stage.style.setProperty("--mass", mass);
    stage.style.setProperty("--mass-far", mixHex(fars[i0], fars[i0 + 1], t));
    stage.style.setProperty("--mass-near", darken(mass, 0.68));
    stage.style.setProperty("--lit", mixHex(lits[i0], lits[i0 + 1], t));
    stage.style.setProperty("--line", mixHex(lines[i0], lines[i0 + 1], t));
    stage.style.setProperty("--glow", mixHex(glows[i0], glows[i0 + 1], t));
    stage.style.setProperty("--tech", mix.tech.toFixed(4));
    stage.style.setProperty("--art", mix.art.toFixed(4));
    stage.style.setProperty("--empty", mix.empty.toFixed(4));

    let best = 0;
    let bestV = -1;
    for (let i = 0; i < order.length; i++) {
      const inf = influence(p, i);
      if (inf > bestV) {
        bestV = inf;
        best = i;
      }
    }

    const worldInf = influence(p, 0);
    stars.style.opacity = worldInf.toFixed(3);
    stars.style.transform = `translate3d(0, ${(p * -16).toFixed(2)}px, 0)`;
    limb.style.opacity = worldInf.toFixed(3);
    limb.style.transform = `translate3d(0, ${((1 - worldInf) * 110).toFixed(2)}px, 0)`;

    const helloOpacity = Math.max(0, Math.min(1, (worldInf - 0.42) / 0.58));
    hello.style.opacity = helloOpacity.toFixed(3);
    hello.style.transform = `translate3d(-50%, ${((1 - helloOpacity) * -18).toFixed(2)}px, 0)`;

    clouds.style.opacity = ((1 - worldInf) * 0.62).toFixed(3);
    cloudShift.style.transform = `translate3d(0, ${((0.5 - p) * 26).toFixed(2)}px, 0)`;
    glow.style.opacity = ((1 - worldInf) * (0.22 + p * 0.5)).toFixed(3);
    hline.style.opacity = ((1 - worldInf) * 0.7).toFixed(3);
    water.style.opacity = (1 - worldInf).toFixed(3);
    water.style.transform = `translate3d(0, ${((0.5 - p) * 20).toFixed(2)}px, 0)`;

    const miamiInf = influence(p, 7);
    bay.style.opacity = (miamiInf * (0.9 - mix.empty * 0.75) * (1 - mix.art * 0.2)).toFixed(3);

    const depthFade = 1 - Math.max(mix.tech, mix.art, mix.empty);
    placeSpans.forEach((span) => {
      const inf = influence(p, +span.dataset.i);
      const o = smoothstep((inf - 0.8) / 0.2) * depthFade;
      span.style.opacity = o.toFixed(3);
    });

    planes.forEach((el) => {
      const i = +el.dataset.i;
      const inf = influence(p, i);
      const amp = el.dataset.plane === "far" ? 110 : el.dataset.plane === "mid" ? 360 : 640;
      const midp = (cuts[i] + cuts[i + 1]) / 2;
      const y = (midp - p) * amp;
      el.style.opacity = inf.toFixed(4);
      el.style.transform = `translate3d(0, ${y.toFixed(2)}px, 0)`;
    });

    const soften = Math.min(1, mix.tech * 0.7 + mix.art * 1 + mix.empty * 0.3);
    if (soften < 0.004) {
      plates.style.filter = "none";
      plates.style.transform = "none";
    } else {
      plates.style.filter = `blur(${(soften * 7).toFixed(2)}px)`;
      plates.style.transform = `scale(${(1 + soften * 0.045).toFixed(4)})`;
    }

    const show = !animating && (settled === "city" ? locked && p > 0.985 : true);
    setBrebot(show);

    document.body.dataset.p = p.toFixed(4);
    document.body.dataset.frame = order[best];
    document.body.dataset.depth = animating ? "moving" : settled;
    document.body.dataset.locked = locked ? "1" : "0";
  }

  function stepAnim(now) {
    const t = Math.min(1, (now - anim.start) / DEPTH_MS);
    const e = ease(t);
    const dest = { tech: 0, art: 0, empty: 0 };
    if (anim.to !== "city") dest[anim.to] = 1;
    mix.tech = anim.from.tech + (dest.tech - anim.from.tech) * e;
    mix.art = anim.from.art + (dest.art - anim.from.art) * e;
    mix.empty = anim.from.empty + (dest.empty - anim.from.empty) * e;
    if (t >= 1) {
      settled = anim.to;
      animating = false;
      anim = null;
      renderVoice(settled);
    }
  }

  function go(to) {
    if (animating || to === settled || !voices[to]) return;
    animating = true;
    pin = window.scrollY || 0;
    setBrebot(false);
    anim = { from: { tech: mix.tech, art: mix.art, empty: mix.empty }, to, start: performance.now() };
  }

  brebotChoices.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    go(b.dataset.go);
  });

  window.addEventListener("wheel", (e) => {
    if (settled !== "city" || animating) e.preventDefault();
  }, { passive: false });

  window.addEventListener("touchmove", (e) => {
    if (settled !== "city" || animating) e.preventDefault();
  }, { passive: false });

  window.addEventListener("keydown", (e) => {
    const block = ["ArrowDown", "ArrowUp", "PageDown", "PageUp", "Home", "End", " "];
    if ((settled !== "city" || animating) && block.includes(e.key)) e.preventDefault();
  });

  window.addEventListener("scroll", () => {
    if ((settled !== "city" || animating) && Math.abs((window.scrollY || 0) - pin) > 1) {
      window.scrollTo(0, pin);
    }
  });

  window.addEventListener("resize", measure);

  history.scrollRestoration = "manual";
  measure();
  renderVoice("city");
  window.scrollTo(0, 0);

  function frame(now) {
    const y = window.scrollY || 0;
    const locked = y >= journeyPx - 0.5;
    const target = locked ? 1 : Math.max(0, Math.min(1, y / journeyPx));
    visual += (target - visual) * LERP;
    if (Math.abs(target - visual) < 0.0004) visual = target;
    if (anim) stepAnim(now);
    paint(visual, locked);
    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
